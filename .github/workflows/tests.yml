name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: bash tools/test.sh
      - run: python tests/lab_test.py
      - run: python tests/research_test.py
      - run: node tests/keyboard_test.mjs
      - run: node tests/demo_model_test.mjs
      - run: node tests/thermal_map_test.mjs
      - run: node tests/survey_planner_test.mjs
  nano-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.8
      - run: arduino-cli lib install Servo@1.3.0
      - run: bash tools/build_nano.sh research
      - run: bash tools/build_nano.sh exploration
